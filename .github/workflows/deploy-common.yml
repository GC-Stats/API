name: Deploy Common

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set tags
        id: tags
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "tags=ghcr.io/gc-stats/api:latest,ghcr.io/gc-stats/api:${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/gc-stats/api:preprod" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via Webhook
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            HOOK_ID="deploy-api"
          else
            HOOK_ID="deploy-api-preprod"
          fi

          PAYLOAD='{"ref":"refs/heads/main"}'

          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | cut -d' ' -f2)

          curl -sf -X POST "https://deploy.gc-stats.app/hooks/${HOOK_ID}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            -d "$PAYLOAD"