[package]
name = "GC-Stats-API"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio", "tls-native-tls", "macros", "chrono"] }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6.8", features = ["auth", "cors", "trace", "normalize-path", "set-header"] }
tower = { version = "0.5", features = ["util"] }
dotenvy = "0.15"
chrono = { version = "0.4.44", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }