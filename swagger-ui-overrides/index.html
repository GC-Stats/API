            .swagger-ui { background: var(--bg-main); color: var(--text-primary); }

            .swagger-ui .info .title { color: var(--text-primary); }
            .swagger-ui .info a { color: var(--brand-yellow); }

            .swagger-ui .opblock-tag {
                color: var(--text-primary);
                border-bottom: 1px solid var(--bg-card-hover);
            }
            .swagger-ui .opblock-tag:hover { background: var(--bg-card-hover); }

            .swagger-ui .opblock {
                background: var(--bg-card);
                border-color: var(--bg-card-hover);
                border-radius: 4px;
                margin-bottom: 4px;
            }
            .swagger-ui .opblock .opblock-summary { background: var(--bg-card); }
            .swagger-ui .opblock .opblock-summary:hover { background: var(--bg-card-hover); }
            .swagger-ui .opblock-summary-description { color: var(--text-secondary); }

            .swagger-ui .opblock.opblock-get {
                background: color-mix(in srgb, var(--brand-yellow) 8%, var(--bg-card));
                border: 0;
                border-left: 3px solid var(--brand-yellow);
                color: white;
            }
            .swagger-ui .opblock.opblock-get .opblock-summary-method {
                background: var(--brand-yellow);
                color: #000;
            }

            .swagger-ui .opblock.opblock-post {
                background: color-mix(in srgb, var(--color-win) 8%, var(--bg-card));
                border-left: 3px solid var(--color-win);
            }
            .swagger-ui .opblock.opblock-post .opblock-summary-method {
                background: var(--color-win);
                color: #000;
            }

            .swagger-ui .opblock.opblock-delete {
                background: color-mix(in srgb, var(--color-loss) 8%, var(--bg-card));
                border-left: 3px solid var(--color-loss);
            }
            .swagger-ui .opblock.opblock-delete .opblock-summary-method {
                background: var(--color-loss);
                color: #fff;
            }

            .swagger-ui .opblock.opblock-put,
            .swagger-ui .opblock.opblock-patch {
                background: color-mix(in srgb, #7c5cbf 8%, var(--bg-card));
                border-left: 3px solid #7c5cbf;
            }
            .swagger-ui .opblock.opblock-put .opblock-summary-method,
            .swagger-ui .opblock.opblock-patch .opblock-summary-method { background: #7c5cbf; }

            .swagger-ui .opblock-body { background: var(--bg-input); }
            .swagger-ui .opblock-description-wrapper p,
            .swagger-ui .opblock-external-docs-wrapper p,
            .swagger-ui .opblock-title_normal p { color: var(--text-secondary); }

            .swagger-ui input,
            .swagger-ui textarea,
            .swagger-ui select {
                background: var(--bg-input) !important;
                color: var(--text-primary) !important;
                border: 1px solid var(--bg-card-hover) !important;
            }
            .swagger-ui input:focus,
            .swagger-ui textarea:focus {
                border-color: var(--brand-yellow) !important;
                outline: none;
            }

            .swagger-ui .download-url-wrapper input {
                background: var(--bg-input) !important;
                color: var(--text-secondary) !important;
                border: 1px solid var(--bg-card-hover) !important;
            }
            .swagger-ui .download-url-wrapper .download-url-button {
                background: var(--brand-yellow) !important;
                color: #000 !important;
                border: none;
            }
            .swagger-ui .download-url-wrapper .download-url-button:hover {
                background: var(--brand-yellow-hover) !important;
            }

            .swagger-ui .btn.execute {
                background: var(--brand-yellow);
                color: #000;
                border-color: var(--brand-yellow);
            }
            .swagger-ui .btn.execute:hover { background: var(--brand-yellow-hover); }

            .swagger-ui .btn {
                color: var(--text-primary);
                border-color: var(--bg-card-hover);
            }
            .swagger-ui .btn:hover { background: var(--bg-card-hover); }

            .swagger-ui .btn.authorize {
                color: var(--brand-yellow);
                border-color: var(--brand-yellow);
            }
            .swagger-ui .btn.authorize svg { fill: var(--brand-yellow); }

            .swagger-ui .response-col_status { color: var(--text-primary); }
            .swagger-ui .response-col_description { color: var(--text-secondary); }
            .swagger-ui table.responses-table thead tr td,
            .swagger-ui table.responses-table thead tr th { color: var(--text-muted); border-color: var(--bg-card-hover); }
            .swagger-ui .responses-inner { background: var(--bg-input); }

            .swagger-ui .response .response-col_status .response-undocumented,
            .swagger-ui .responses-table .response-col_status { color: var(--text-primary); }

            .swagger-ui section.models { background: var(--bg-card); border-color: var(--bg-card-hover); }
            .swagger-ui section.models h4 { color: var(--text-primary); border-color: var(--bg-card-hover); }
            .swagger-ui .model-box { background: var(--bg-input); }
            .swagger-ui .model { color: var(--text-secondary); }
            .swagger-ui .model-title { color: var(--text-primary); }

            .swagger-ui a { color: var(--brand-yellow); }
            .swagger-ui a:hover { color: var(--brand-yellow-hover); }

            .swagger-ui p,
            .swagger-ui h1, .swagger-ui h2, .swagger-ui h3,
            .swagger-ui h4, .swagger-ui h5,
            .swagger-ui label { color: var(--text-primary); }

            .swagger-ui .parameter__name { color: var(--text-primary); }
            .swagger-ui .parameter__type { color: var(--text-muted); }
            .swagger-ui table thead tr th,
            .swagger-ui table thead tr td { color: var(--text-muted); border-color: var(--bg-card-hover); }

            .swagger-ui .json-schema-2020-12-head {
                border-color: var(--bg-card-hover) !important;
            }

            .swagger-ui .json-schema-2020-12-accordion {
                background: var(--bg-card) !important;
                color: var(--text-primary) !important;
            }

            .swagger-ui .json-schema-2020-12-accordion:hover {
                background: var(--bg-card-hover) !important;
            }

            .swagger-ui .json-schema-2020-12-expand-deep-button {
                background: var(--bg-card) !important;
                color: var(--brand-yellow) !important;
                border-color: var(--brand-yellow) !important;
            }

            .swagger-ui .json-schema-2020-12-expand-deep-button:hover {
                background: var(--bg-card-hover) !important;
            }

            .swagger-ui .json-schema-2020-12-accordion__icon svg {
                fill: var(--text-secondary) !important;
            }

            .swagger-ui .opblock-summary-path,
            .swagger-ui .opblock-summary-path a,
            .swagger-ui .opblock-summary-path span {
                color: var(--text-primary) !important;
            }

            .swagger-ui .opblock-section-header h4,
            .swagger-ui .opblock-section-header label {
                color: var(--text-primary) !important;
            }

            .swagger-ui .opblock-section-header {
                background: var(--bg-card-hover) !important;
                border-color: var(--bg-card-hover) !important;
            }

            .swagger-ui .scheme-container {
                background: var(--bg-main);
                color: var(--text-primary) !important;
            }

            .swagger-ui .modal-ux {
                background: var(--bg-card) !important;
                color: var(--text-primary) !important;
                border: 1px solid var(--bg-main) !important;
            }

            .swagger-ui .modal-ux-header {
                border-bottom: 1px solid var(--bg-main) !important;
            }

            h3 {
                color: var(--text-primary) !important;
            }

            p {
                color: var(--text-secondary) !important;
            }
        </style>
